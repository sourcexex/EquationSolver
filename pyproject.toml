[project]
name = "equationsolver"
version = "0.1.0"
description = "A Equation Solver"
readme = "README.md"
authors = [
    { name = "sourcexex", email = "sourcexex@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.12.0",
    "sympy>=1.14.0",
]

[project.scripts]
equationsolver = "equationsolver:main"

