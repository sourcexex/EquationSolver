name: Build

on:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: EquationSolver
  PYTHON_VERSION: "3.13"

jobs:
  nuitka:
    name: Nuitka standalone (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Nuitka 的版本号必须是 1-4 段数字
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "标签 '${GITHUB_REF_NAME}' 不是合法的版本标签(如 v1.2.3)" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Verify clang toolchain
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path "$llvm\clang-cl.exe") {
            Add-Content -Path $env:GITHUB_PATH -Value $llvm
            & "$llvm\clang-cl.exe" --version
          } elseif (Get-Command clang-cl -ErrorAction SilentlyContinue) {
            clang-cl --version
          } else {
            throw "clang-cl not found; switch the build to --mingw64 instead"
          }

      - name: Build with Nuitka (standalone / multi-file)
        shell: bash
        run: |
          mkdir -p build
          uv run python -m nuitka \
            --assume-yes-for-downloads \
            --standalone \
            --clang \
            --jobs=2 \
            --lto=no \
            --enable-plugin=pyside6 \
            --include-package-data=sympy \
            --nofollow-import-to=sympy.testing \
            --nofollow-import-to=sympy.*.tests \
            --include-data-dir=src/resources=src/resources \
            --windows-console-mode=disable \
            --windows-icon-from-ico=src/resources/logo.ico \
            --company-name=SourceX \
            --product-name=EquationSolver \
            --file-description="A Equation Solver" \
            --file-version=${{ steps.version.outputs.version }} \
            --product-version=${{ steps.version.outputs.version }} \
            --output-dir=build \
            --output-filename=EquationSolver.exe \
            --report=build/compile-report.xml \
            --remove-output \
            src/main.py

      - name: Assemble package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $dist = Get-ChildItem -Path build -Directory -Filter '*.dist' | Select-Object -First 1
          if (-not $dist) { throw "Nuitka dist folder not found" }
          Move-Item -Path $dist.FullName -Destination "${{ env.APP_NAME }}" -Force
          Copy-Item -Path LICENSE -Destination "${{ env.APP_NAME }}/LICENSE" -ErrorAction SilentlyContinue
          Copy-Item -Path README.md -Destination "${{ env.APP_NAME }}/README.md" -ErrorAction SilentlyContinue
          Compress-Archive -Path "${{ env.APP_NAME }}" -DestinationPath "${{ env.APP_NAME }}-$env:VERSION-windows-x64.zip" -Force
          Get-ChildItem "${{ env.APP_NAME }}" | Select-Object -First 20 Name, Length

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-report
          path: build/compile-report.xml
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-windows-x64
          path: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="${APP_NAME}-${VERSION}-windows-x64.zip"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "$asset" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$asset" \
                 --title "$GITHUB_REF_NAME" --generate-notes
